version: "3.8"

services:
  # =============================================================================
  # Credit Risk Scoring API Service
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: credit-risk-scoring:latest
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      # Mount model artifacts (for local development)
      - ./models:/app/models:ro
      # Mount config (for local development)
      - ./config:/app/config:ro
      # Logs volume
      - api-logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # =============================================================================
  # Prometheus for Metrics Collection (Optional)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    profiles:
      - monitoring
    restart: unless-stopped

  # =============================================================================
  # Grafana for Visualization (Optional)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  api-logs:
  prometheus-data:
  grafana-data:
